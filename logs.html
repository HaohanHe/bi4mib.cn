<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通联日志 - BI4MIB</title>
    <meta name="description" content="BI4MIB 通联日志 | QSO Logbook">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-1PKOgEeU68CJ8K8pF/va8FsM3qMpLprZQX2mWQ4uWTl5iYV9XHnFT0zGzPGLo1BKR+BYbLH7X5MhS0kOHpXfvg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
/* BI4MIB Logbook — 与主页一致的设计系统（暗色 * 香槟金） */
:root {
    --bg-0: #07080b;
    --bg-1: #0a0c11;
    --surface: rgba(255, 255, 255, 0.028);
    --surface-2: rgba(255, 255, 255, 0.05);
    --surface-3: rgba(255, 255, 255, 0.08);
    --line: rgba(255, 255, 255, 0.07);
    --line-strong: rgba(255, 255, 255, 0.14);
    --text-1: #f5f3ef;
    --text-2: #a9a6a0;
    --text-3: #716e68;
    --gold: #d9bd8f;
    --gold-strong: #ecd3a6;
    --gold-dim: rgba(217, 189, 143, 0.14);
    --warm: #e8a87c;
    --r-s: 10px;
    --r-m: 16px;
    --r-l: 22px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --shadow-m: 0 12px 40px rgba(0, 0, 0, 0.45);
    --font-display: "Space Grotesk", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "HarmonyOS Sans SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    font-family: var(--font-sans);
    background: var(--bg-0);
    color: var(--text-1);
    line-height: 1.75;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
}
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(60rem 40rem at 12% -8%, rgba(217, 189, 143, 0.07), transparent 60%),
        radial-gradient(50rem 36rem at 92% 8%, rgba(232, 168, 124, 0.05), transparent 55%),
        var(--bg-0);
    z-index: -1;
    pointer-events: none;
}
::selection { background: rgba(217, 189, 143, 0.32); color: #fff; }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: var(--bg-0); }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 99px; border: 2px solid var(--bg-0); }
*:focus { outline: none; }
*:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 4px; }

.container {
    width: min(1080px, calc(100% - 48px));
    margin-inline: auto;
    padding: 56px 0 64px;
    position: relative;
}

.page-header { text-align: center; margin-bottom: 44px; }
.back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    color: var(--text-3);
    margin-bottom: 26px;
    padding: 8px 18px;
    border: 1px solid var(--line);
    border-radius: 99px;
    background: var(--surface);
    transition: all 0.3s var(--ease);
}
.back-link:hover { color: var(--gold); border-color: rgba(217, 189, 143, 0.4); background: var(--gold-dim); }
.page-title {
    font-family: var(--font-display);
    font-size: clamp(30px, 5vw, 44px);
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text-1);
    margin-bottom: 10px;
}
.page-subtitle { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.16em; color: var(--text-3); }

.stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 36px;
}
.stat-item {
    position: relative;
    text-align: center;
    padding: 26px 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-l);
    overflow: hidden;
    transition: border-color 0.35s var(--ease), transform 0.35s var(--ease);
}
.stat-item:hover { border-color: rgba(217, 189, 143, 0.35); transform: translateY(-3px); }
.stat-item::before {
    content: "";
    position: absolute;
    inset: auto 0 0 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(217, 189, 143, 0.5), transparent);
}
.stat-value {
    display: block;
    font-family: var(--font-display);
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--gold);
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
}
.stat-label {
    display: block;
    margin-top: 8px;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-3);
}

.controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
}
.filter-group { display: flex; flex-wrap: wrap; gap: 8px; }
.filter-btn {
    padding: 8px 18px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--text-3);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 99px;
    cursor: pointer;
    transition: all 0.25s var(--ease);
}
.filter-btn:hover { color: var(--text-1); border-color: var(--line-strong); }
.filter-btn.active { color: #14100a; background: var(--gold); border-color: var(--gold); font-weight: 600; }

.sort-select, .search-box {
    padding: 9px 16px;
    font-family: var(--font-sans);
    font-size: 13.5px;
    color: var(--text-1);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 99px;
    transition: border-color 0.25s var(--ease);
}
.sort-select:hover, .search-box:hover, .sort-select:focus, .search-box:focus { border-color: rgba(217, 189, 143, 0.4); }
.sort-select option { background: var(--bg-1); color: var(--text-1); }
.search-box { width: min(280px, 100%); }

.result-count {
    font-size: 13px;
    color: var(--text-3);
    margin-bottom: 16px;
}
.result-count strong { color: var(--gold); font-weight: 600; }

.log-list {
    border: 1px solid var(--line);
    border-radius: var(--r-l);
    background: var(--surface);
    overflow: hidden;
}
.loading, .empty-state {
    padding: 56px 20px;
    text-align: center;
    font-size: 14px;
    color: var(--text-3);
}
.empty-state i { display: block; font-size: 30px; margin-bottom: 14px; color: var(--text-3); opacity: 0.7; }

.log-header {
    display: grid;
    grid-template-columns: 110px 84px 150px 1fr 90px 96px;
    gap: 12px;
    padding: 14px 22px;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-3);
    background: var(--surface-2);
    border-bottom: 1px solid var(--line);
}
.log-header > div[data-sort] { cursor: pointer; user-select: none; transition: color 0.25s var(--ease); }
.log-header > div[data-sort]:hover { color: var(--gold); }
.log-header > div.active-sort { color: var(--gold); }
.sort-icon { font-size: 9px; opacity: 0.6; margin-left: 4px; }

.log-item {
    display: grid;
    grid-template-columns: 110px 84px 150px 1fr 90px 96px;
    gap: 12px;
    align-items: center;
    padding: 15px 22px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    color: var(--text-2);
    animation: rowIn 0.45s var(--ease) both;
    transition: background 0.25s var(--ease);
}
.log-item:last-child { border-bottom: none; }
.log-item:hover { background: var(--surface-2); }
@keyframes rowIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
}

.log-date { font-family: var(--font-mono); font-size: 12.5px; color: var(--text-3); }
.log-time { font-family: var(--font-mono); font-size: 12.5px; color: var(--text-2); }
.log-callsign { font-family: var(--font-mono); font-weight: 500; color: var(--gold); letter-spacing: 0.04em; }
.log-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.log-location { font-size: 13.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log-device { font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log-mode {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--gold);
    background: var(--gold-dim);
    border: 1px solid rgba(217, 189, 143, 0.25);
    border-radius: 99px;
    padding: 4px 0;
    text-align: center;
    justify-self: start;
    min-width: 64px;
}
.log-rst { font-family: var(--font-mono); font-size: 13px; color: var(--text-2); }

.pagination {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 28px;
}
.page-btn {
    min-width: 38px;
    height: 38px;
    padding: 0 12px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-2);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.25s var(--ease);
}
.page-btn:hover:not([disabled]) { color: var(--text-1); border-color: var(--line-strong); background: var(--surface-2); }
.page-btn.active { color: #14100a; background: var(--gold); border-color: var(--gold); font-weight: 600; }
.page-btn[disabled] { opacity: 0.35; cursor: not-allowed; }
.page-info { color: var(--text-3); padding: 0 4px; }

.footer {
    margin-top: 56px;
    padding-top: 32px;
    border-top: 1px solid var(--line);
    text-align: center;
}
.beian-wrapper {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 22px;
    margin-bottom: 14px;
}
.beian-link {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--text-3);
    transition: color 0.25s var(--ease);
}
.beian-link:hover { color: var(--text-2); }
.beian-link img { opacity: 0.6; }
.footer p { font-size: 12.5px; color: var(--text-3); }
.footer p a { color: var(--gold); }
.footer p a:hover { color: var(--gold-strong); }

@media (max-width: 760px) {
    .stats-row { grid-template-columns: 1fr; gap: 12px; }
    .stat-item { display: flex; align-items: baseline; justify-content: center; gap: 14px; padding: 18px; }
    .stat-label { margin-top: 0; }
    .log-header { display: none; }
    .log-item {
        grid-template-columns: 1fr 1fr;
        gap: 6px 12px;
        padding: 16px 18px;
    }
    .log-mode { justify-self: start; }
    .controls { flex-direction: column; align-items: stretch; }
    .search-box { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    html { scroll-behavior: auto; }
}
</style>

<body>
    <div class="container">
        <header class="page-header">
            <a href="/" class="back-link">
                <i class="fas fa-arrow-left"></i>
                <span data-i18n="back">返回主页</span>
            </a>
            <h1 class="page-title" data-i18n="title">通联日志</h1>
            <p class="page-subtitle">QSO Logbook</p>
        </header>

        <div class="stats-row" id="stats">
            <div class="stat-item"><div class="stat-value" id="totalQSO">-</div><div class="stat-label">Total QSO</div></div>
            <div class="stat-item"><div class="stat-value" id="totalCountries">-</div><div class="stat-label">Countries</div></div>
            <div class="stat-item"><div class="stat-value" id="totalModes">-</div><div class="stat-label">Modes</div></div>
        </div>

        <div class="controls">
            <div class="search-box">
                <i class="fas fa-search" aria-hidden="true"></i>
                <input type="text" id="searchInput" placeholder="搜索呼号、姓名、QTH..." autocomplete="off" aria-label="搜索通联记录">
            </div>
            <div class="filter-group" id="modeFilters" role="group" aria-label="模式筛选">
                <button class="filter-btn active" data-mode="all">全部</button>
            </div>
            <select class="sort-select" id="sortSelect" aria-label="排序方式">
                <option value="date_desc">最新优先</option>
                <option value="date_asc">最早优先</option>
                <option value="callsign">按呼号</option>
                <option value="mode">按模式</option>
            </select>
        </div>

        <div class="result-count" id="resultCount" aria-live="polite"></div>

        <div class="log-list" id="logList" role="list" aria-label="通联记录列表">
            <div class="loading" aria-live="polite">加载中</div>
        </div>

        <div class="pagination" id="pagination"></div>

        <footer class="footer">
            <div class="beian-wrapper">
                <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer" class="beian-link">吉ICP备2026002008号-1</a>
                <a href="https://beian.mps.gov.cn/#/query/webSearch?code=22017202000588" target="_blank" rel="noreferrer" class="beian-link police">
                    <img src="备案图标.png" alt="" width="14" height="14"> 吉公网安备22017202000588号
                </a>
            </div>
            <p><a href="https://bi4mib.cn">BI4MIB.cn</a> · 73 & Good DX!</p>
        </footer>
    </div>

    <script>
    const DATA_URL = 'data/logs.json';
    let currentPage = 1;
    let currentMode = 'all';
    let currentSearch = '';
    let currentSort = 'date_desc';
    let debounceTimer = null;
    let allLogs = [];

    function getDXCC(callsign) {
        const c = (callsign || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (/^B[ABCDFGHJKLMNP]/.test(c)) return 'CN';
        if (/^S2/.test(c)) return 'BD';
        if (/^J[HS]/.test(c)) return 'JA';
        if (/^HL/.test(c)) return 'HL';
        if (/^[KNW][0-9]/.test(c)) return 'NA';
        if (/^R[0-9]/.test(c)) return 'RU';
        if (/^[GM][0-9]/.test(c)) return 'G';
        if (/^D[A-R][0-9]/.test(c)) return 'DL';
        if (/^F[A-K][0-9]/.test(c)) return 'F';
        if (/^VK[0-9]/.test(c)) return 'VK';
        return c.charAt(0);
    }

    function computeStats(logs) {
        const dxcc = new Set();
        const modes = new Set();
        logs.forEach(l => {
            const d = getDXCC(l.callsign);
            if (d) dxcc.add(d);
            if (l.mode) modes.add(l.mode);
        });
        return { totalQSO: logs.length, countries: dxcc.size, modes: [...modes].sort() };
    }

    async function initData() {
        try {
            const res = await fetch(DATA_URL);
            const data = await res.json();
            allLogs = data.logs || [];
        } catch (e) {
            console.error('Failed to load logs:', e);
        }
        loadLogs();
    }

    function sortLogs(logs, sort) {
        const key = l => (l.date || '') + (l.time || '');
        const sorted = [...logs];
        switch (sort) {
            case 'date_asc':
                sorted.sort((a, b) => key(a).localeCompare(key(b)));
                break;
            case 'callsign':
                sorted.sort((a, b) => (a.callsign || '').localeCompare(b.callsign || ''));
                break;
            case 'mode':
                sorted.sort((a, b) => (a.mode || '').localeCompare(b.mode || ''));
                break;
            default:
                sorted.sort((a, b) => key(b).localeCompare(key(a)));
        }
        return sorted;
    }

    async function loadLogs(page = 1) {
        currentPage = page;

        let logs = [...allLogs];
        if (currentSearch) {
            const s = currentSearch.toLowerCase();
            logs = logs.filter(l =>
                (l.callsign || '').toLowerCase().includes(s) ||
                (l.name || '').toLowerCase().includes(s) ||
                (l.qth || '').toLowerCase().includes(s) ||
                (l.country || '').toLowerCase().includes(s)
            );
        }

        const stats = computeStats(allLogs);
        const data = {
            success: true,
            callsign: 'BI4MIB',
            statistics: stats,
            filters: { modes: [...new Set(logs.map(l => l.mode || ''))].filter(Boolean).sort() }
        };

        if (currentMode && currentMode !== 'all') {
            logs = logs.filter(l => (l.mode || '').toLowerCase() === currentMode);
        }

        logs = sortLogs(logs, currentSort);

        const total = logs.length;
        const perPage = 20;
        const totalPages = Math.max(1, Math.ceil(total / perPage));
        const cur = Math.min(page, totalPages);
        data.logs = logs.slice((cur - 1) * perPage, cur * perPage);
        data.pagination = { page: cur, per_page: perPage, total, total_pages: totalPages };
        data.last_updated = '';

        updateStats(data.statistics);
        renderModeFilters(data.filters?.modes || []);
        renderLogs(data.logs, data.pagination);
        renderPagination(data.pagination);
        renderResultCount(data.pagination);
    }


    function updateStats(stats) {
        document.getElementById('totalQSO').textContent = stats.totalQSO || 0;
        document.getElementById('totalCountries').textContent = stats.countries || 0;
        document.getElementById('totalModes').textContent = stats.modes?.length || 0;
    }

    function renderModeFilters(modes) {
        const container = document.getElementById('modeFilters');
        if (!container.dataset.init) {
            container.innerHTML = '<button class="filter-btn active" data-mode="all">全部</button>';
            modes.forEach(m => {
                if (!m) return;
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.mode = m.toLowerCase();
                btn.textContent = m.toUpperCase();
                container.appendChild(btn);
            });
            container.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentMode = btn.dataset.mode;
                    loadLogs(1);
                });
            });
            container.dataset.init = '1';
        }
    }

    function renderLogs(logs, pagination) {
        const container = document.getElementById('logList');
        if (!logs || logs.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i>没有找到匹配的日志</div>';
            return;
        }

        const header = `<div class="log-header">
            <div data-sort="date">日期 <i class="fas fa-sort sort-icon"></i></div>
            <div data-sort="time">时间</div>
            <div data-sort="callsign">呼号 <i class="fas fa-sort sort-icon"></i></div>
            <div>QTH</div>
            <div data-sort="mode">模式 <i class="fas fa-sort sort-icon"></i></div>
            <div>RST</div>
        </div>`;

        const rows = logs.map((log, i) => {
            const date = log.date ? log.date.substring(0, 10) : '-';
            const time = log.time || '-';
            const qth = log.country || log.qth || '-';
            const rst = `${log.rstSent || '-'}/${log.rstReceived || '-'}`;
            const device = log.remarks || log.device || '';
            const modeClass = log.mode ? log.mode.toLowerCase().replace(/[^a-z0-9]/g, '') : '';
            return `<div class="log-item" style="animation-delay:${i * 0.03}s">
                <div class="log-date">${date}</div>
                <div class="log-time">${time}</div>
                <div class="log-callsign">${escapeHtml(log.callsign)}</div>
                <div class="log-info">
                    <div class="log-location">${escapeHtml(qth)}</div>
                    ${device ? `<div class="log-device">${escapeHtml(device)}</div>` : ''}
                </div>
                <div class="log-mode ${modeClass}">${escapeHtml(log.mode)}</div>
                <div class="log-rst">${rst}</div>
            </div>`;
        }).join('');

        container.innerHTML = header + rows;

        container.querySelectorAll('.log-header > div[data-sort]').forEach(div => {
            div.addEventListener('click', () => {
                const field = div.dataset.sort;
                const sortMap = { date: 'date_desc', callsign: 'callsign', mode: 'mode' };
                const nextSort = currentSort === sortMap[field] ? (field === 'date' ? 'date_asc' : sortMap[field]) : sortMap[field];
                currentSort = nextSort;
                document.getElementById('sortSelect').value = nextSort;
                container.querySelectorAll('.log-header > div').forEach(d => d.classList.remove('active-sort'));
                div.classList.add('active-sort');
                loadLogs(1);
            });
        });
    }

    function renderPagination(p) {
        const container = document.getElementById('pagination');
        if (!p || p.total_pages <= 1) { container.innerHTML = ''; return; }

        let html = '';
        html += `<button class="page-btn" ${p.page <= 1 ? 'disabled' : ''} data-page="${p.page - 1}"><i class="fas fa-chevron-left"></i></button>`;

        const range = getPageRange(p.page, p.total_pages);
        range.forEach(item => {
            if (item === '...') {
                html += '<span class="page-info">...</span>';
            } else {
                html += `<button class="page-btn ${item === p.page ? 'active' : ''}" data-page="${item}">${item}</button>`;
            }
        });

        html += `<button class="page-btn" ${p.page >= p.total_pages ? 'disabled' : ''} data-page="${p.page + 1}"><i class="fas fa-chevron-right"></i></button>`;

        container.innerHTML = html;
        container.querySelectorAll('.page-btn:not([disabled])').forEach(btn => {
            btn.addEventListener('click', () => loadLogs(parseInt(btn.dataset.page)));
        });
    }

    function getPageRange(current, total) {
        if (total <= 7) return Array.from({length: total}, (_, i) => i + 1);
        const pages = [];
        pages.push(1);
        if (current > 3) pages.push('...');
        for (let i = Math.max(2, current - 1); i <= Math.min(total - 1, current + 1); i++) pages.push(i);
        if (current < total - 2) pages.push('...');
        pages.push(total);
        return pages;
    }

    function renderResultCount(p) {
        const el = document.getElementById('resultCount');
        if (!p) { el.innerHTML = ''; return; }
        el.innerHTML = `共 <strong>${p.total}</strong> 条记录，第 ${p.page}/${p.total_pages} 页`;
    }

    function escapeHtml(t) {
        if (!t) return '';
        const d = document.createElement('div');
        d.textContent = t;
        return d.innerHTML;
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            currentSearch = e.target.value.trim();
            loadLogs(1);
        }, 300);
    });

    document.getElementById('sortSelect').addEventListener('change', (e) => {
        currentSort = e.target.value;
        loadLogs(1);
    });

    initData();
    </script>
</body>
</html>
